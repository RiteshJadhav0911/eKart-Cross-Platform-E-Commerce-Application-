<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Audit Results</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f1f5f9;
            padding: 2rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            color: #38bdf8;
            margin: 0;
            font-size: 2.5rem;
        }
        .header p {
            color: #94a3b8;
        }
        .card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #3b82f6;
        }
        .card.success {
            border-left-color: #22c55e;
        }
        .card.fail {
            border-left-color: #ef4444;
        }
        .card.running {
            border-left-color: #fbbf24;
        }
        .card h2 {
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status {
            font-weight: bold;
            font-size: 1rem;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .success .status { background-color: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .fail .status { background-color: rgba(239, 68, 68, 0.2); color: #f87171; }
        .running .status { background-color: rgba(251, 191, 36, 0.2); color: #fcd34d; }
        
        pre {
            background-color: #0f172a;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            color: #a5b4fc;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>eKart Security Audit Report</h1>
        <p>Automated visual verification of server security features</p>
    </div>

    <div id="tests">
        <!-- Results injected here -->
    </div>

    <script>
        const testsDiv = document.getElementById('tests');

        function createCard(id, title) {
            const el = document.createElement('div');
            el.className = 'card running';
            el.id = id;
            el.innerHTML = `
                <h2>${title} <span class="status">RUNNING...</span></h2>
                <div class="content"><p>Executing test...</p></div>
            `;
            testsDiv.appendChild(el);
            return el;
        }

        function updateCard(id, success, message, details) {
            const el = document.getElementById(id);
            el.className = 'card ' + (success ? 'success' : 'fail');
            el.querySelector('.status').innerText = success ? 'PASSED' : 'FAILED';
            el.querySelector('.content').innerHTML = `
                <p><strong>Result:</strong> ${message}</p>
                <pre>${details}</pre>
            `;
        }

        async function runAudits() {
            // Test 1: Headers
            createCard('test-headers', 'Security Headers (Helmet)');
            try {
                const res = await fetch('/api/health');
                const csp = res.headers.get('Content-Security-Policy');
                const pby = res.headers.get('X-Powered-By');
                if (csp && !pby) {
                    updateCard('test-headers', true, 'Helmet is active.', `Content-Security-Policy: ${csp}\nX-Powered-By is hidden.`);
                } else {
                    updateCard('test-headers', false, 'Headers not secure.', `CSP: ${csp}\nX-Powered-By: ${pby}`);
                }
            } catch (e) { updateCard('test-headers', false, 'Error', e.message); }

            // Test 2: Payload Limit
            createCard('test-payload', 'Payload Size Limit (10kb)');
            try {
                // Generate 15kb string
                const largeString = 'a'.repeat(15000);
                const res = await fetch('/api/health', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: largeString })
                });
                if (res.status === 413) {
                    updateCard('test-payload', true, 'Large payload rejected correctly.', `Status Code: 413 Payload Too Large`);
                } else {
                    updateCard('test-payload', false, 'Failed to reject large payload.', `Status Code: ${res.status}`);
                }
            } catch (e) { updateCard('test-payload', false, 'Error', e.message); }

            // Test 3: NoSQL Injection
            createCard('test-nosql', 'NoSQL Injection Protection (mongoSanitize)');
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: { "$gt": "" }, password: "123" }) // Malicious payload
                });
                const data = await res.json();
                // Instead of logging in with random user (which happens if vulnerable), we should get standard auth failed or validation error.
                if (res.status >= 400 && res.status < 500) {
                    updateCard('test-nosql', true, 'NoSQL injection attempt blocked/sanitized.', `Response Status: ${res.status}\nMessage: ${data.message || data.error || 'Bad Request'}`);
                } else {
                    updateCard('test-nosql', false, 'Possible NoSQL injection vulnerability.', `Status Code: ${res.status}`);
                }
            } catch (e) { updateCard('test-nosql', false, 'Error', e.message); }

            // Test 4: Rate Limiter
            createCard('test-rate', 'API Rate Limiting');
            try {
                let hitRateLimit = false;
                let lastStatus = 200;
                // Hit API 110 times quickly
                const reqs = [];
                for(let i=0; i<110; i++) {
                    reqs.push(fetch('/api/health'));
                }
                const responses = await Promise.all(reqs);
                for(let r of responses) {
                    if (r.status === 429) {
                        hitRateLimit = true;
                        lastStatus = 429;
                        break;
                    }
                }
                
                if (hitRateLimit) {
                    updateCard('test-rate', true, 'Rate limiter triggered after rapid requests.', `Final Status Code: 429 Too Many Requests`);
                } else {
                    updateCard('test-rate', false, 'Rate limiter not triggered.', `Made 110 requests, none blocked.`);
                }
            } catch (e) { updateCard('test-rate', false, 'Error', e.message); }
        }

        setTimeout(runAudits, 500);
    </script>
</body>
</html>
